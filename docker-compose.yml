services:
  ashercarlow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APPLE_MUSIC_DEVELOPER_TOKEN=${APPLE_MUSIC_DEVELOPER_TOKEN:-}
      - ASHERCARLOW_AUTH_TOKEN=${ASHERCARLOW_AUTH_TOKEN:-}
      - SWTCW_DB_PATH=/app/data/swtcw.sqlite
    volumes:
      - ./data:/app/data
    restart: unless-stopped
